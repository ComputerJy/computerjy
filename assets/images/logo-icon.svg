    <path d="M 78 56 L 98 70 L 78 84 Z" fill="url(#playGrad)"></path>
    
    
    <g transform="translate(108, 26)">
      
      <g transform="translate(14, -14)" filter="url(#sparkleGlow)">
        <path d="M 0 -14 Q 0 0, 14 0 Q 0 0, 0 14 Q 0 0, -14 0 Q 0 0, 0 -14 Z" fill="url(#starGrad)"></path>
        <circle cx="10" cy="-8" r="2.5" fill="#FFD166"></circle>
      </g>

      
      <path d="M 12 10                L 26 10                L 26 70                C 26 88, 12 98, -8 98                C -22 98, -32 90, -36 82                L -24 72                C -20 78, -14 82, -6 82                C 6 82, 12 76, 12 64                Z" fill="url(#jGrad)"></path>
    </g>

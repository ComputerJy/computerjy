<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"></stop>
      <stop offset="50%" stop-color="#0080FF"></stop>
      <stop offset="100%" stop-color="#3A0CA3"></stop>
    </linearGradient>

    
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FA"></stop>
      <stop offset="100%" stop-color="#7209B7"></stop>
    </linearGradient>

    
    <linearGradient id="jGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF70A6"></stop>
      <stop offset="30%" stop-color="#9B5DE5"></stop>
      <stop offset="60%" stop-color="#F15BB5"></stop>
      <stop offset="85%" stop-color="#F77F00"></stop>
      <stop offset="100%" stop-color="#FFD166"></stop>
    </linearGradient>

    
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"></stop>
      <stop offset="50%" stop-color="#FF9F1C"></stop>
      <stop offset="100%" stop-color="#FF4040"></stop>
    </linearGradient>

    
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
    </filter>
  </defs>

  
  
  <g transform="translate(15, 20)">
    
    <rect x="-6" y="24" width="14" height="14" fill="#00D2FF" rx="2"></rect>
    <rect x="8" y="38" width="12" height="12" fill="#00C0FA" rx="2"></rect>
    <rect x="-6" y="60" width="14" height="16" fill="#0080FF" rx="2"></rect>
    <rect x="-6" y="78" width="14" height="16" fill="#1D4ED8" rx="2"></rect>

    
    <path d="M 55 12              C 82 12, 102 26, 106 44              L 88 48              C 84 37, 72 28, 55 28              C 32 28, 16 46, 16 70              C 16 94, 32 112, 55 112              C 72 112, 85 102, 90 90              L 108 94              C 102 114, 82 128, 55 128              C 24 128, 0 102, 0 70              C 0 38, 24 12, 55 12 Z" fill="url(#cGrad)"></path>

    
    <g transform="translate(42, 50)">
      
      <ellipse cx="6" cy="6" rx="3.5" ry="5.5" fill="#0F172A"></ellipse>
      
      <ellipse cx="24" cy="6" rx="3.5" ry="5.5" fill="#0F172A"></ellipse>
      
      <path d="M 6 18 Q 15 29, 24 18 Z" fill="#0F172A"></path>
      <path d="M 9 21 Q 15 27, 21 21 Z" fill="#FF4D6D"></path>

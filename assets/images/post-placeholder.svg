<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <defs>
    <pattern id="circuit" width="120" height="120" patternUnits="userSpaceOnUse">
      <g stroke="#94a3b8" fill="#94a3b8" opacity="0.14" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0 30 L 40 30 L 60 50 L 120 50" fill="none" />
        <circle cx="40" cy="30" r="3" stroke="none" />
        <circle cx="120" cy="50" r="3" stroke="none" />
        <path d="M 30 120 L 30 90 L 50 70 L 50 0" fill="none" />
        <circle cx="30" cy="90" r="3" stroke="none" />
        <circle cx="50" cy="70" r="3" stroke="none" />
        <path d="M 80 0 L 80 40 L 100 60 L 100 120" fill="none" />
        <circle cx="80" cy="40" r="3" stroke="none" />
        <circle cx="100" cy="60" r="3" stroke="none" />
        <rect x="56" y="86" width="8" height="8" rx="1.5" stroke="none" />
        <rect x="10" y="60" width="6" height="6" rx="1" stroke="none" />
      </g>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0080ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0080ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#3A0CA3" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FA" />
      <stop offset="100%" stop-color="#7209B7" />
    </linearGradient>
    <linearGradient id="jGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF70A6" />
      <stop offset="30%" stop-color="#9B5DE5" />
      <stop offset="60%" stop-color="#F15BB5" />
      <stop offset="85%" stop-color="#F77F00" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FF9F1C" />
      <stop offset="100%" stop-color="#FF4040" />
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="#0d121c" />
  <rect width="640" height="400" fill="url(#circuit)" />
  <rect width="640" height="400" fill="url(#glow)" />

  <!-- Logo icon, centred -->
  <svg x="245" y="125" width="150" height="150" viewBox="0 0 200 200">
    <g transform="translate(15, 20)">
      <rect x="-6" y="24" width="14" height="14" fill="#00D2FF" rx="2" />
      <rect x="8" y="38" width="12" height="12" fill="#00C0FA" rx="2" />
      <rect x="-6" y="60" width="14" height="16" fill="#0080FF" rx="2" />
      <rect x="-6" y="78" width="14" height="16" fill="#1D4ED8" rx="2" />
      <path d="M 55 12 C 82 12, 102 26, 106 44 L 88 48 C 84 37, 72 28, 55 28 C 32 28, 16 46, 16 70 C 16 94, 32 112, 55 112 C 72 112, 85 102, 90 90 L 108 94 C 102 114, 82 128, 55 128 C 24 128, 0 102, 0 70 C 0 38, 24 12, 55 12 Z" fill="url(#cGrad)" />
      <g transform="translate(42, 50)">
        <ellipse cx="6" cy="6" rx="3.5" ry="5.5" fill="#0F172A" />
        <ellipse cx="24" cy="6" rx="3.5" ry="5.5" fill="#0F172A" />
        <path d="M 6 18 Q 15 29, 24 18 Z" fill="#0F172A" />
        <path d="M 9 21 Q 15 27, 21 21 Z" fill="#FF4D6D" />
      </g>
      <path d="M 78 56 L 98 70 L 78 84 Z" fill="url(#playGrad)" />
      <g transform="translate(108, 26)">
        <g transform="translate(14, -14)">
          <path d="M 0 -14 Q 0 0, 14 0 Q 0 0, 0 14 Q 0 0, -14 0 Q 0 0, 0 -14 Z" fill="url(#starGrad)" />
          <circle cx="10" cy="-8" r="2.5" fill="#FFD166" />
        </g>
        <path d="M 12 10 L 26 10 L 26 70 C 26 88, 12 98, -8 98 C -22 98, -32 90, -36 82 L -24 72 C -20 78, -14 82, -6 82 C 6 82, 12 76, 12 64 Z" fill="url(#jGrad)" />
      </g>
    </g>
  </svg>
</svg>

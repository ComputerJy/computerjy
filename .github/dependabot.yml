version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      timezone: 'Asia/Amman'
    # Wait a week before proposing a new release, so a compromised version is
    # usually yanked before it reaches a PR.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      timezone: 'Asia/Amman'
    # Wait a week before proposing a new release, so a compromised version is
    # usually yanked before it reaches a PR.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps-ga)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
      timezone: 'Asia/Amman'
    # Wait a week before proposing a new release, so a compromised version is
    # usually yanked before it reaches a PR.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    groups:
      composer:
        patterns: ['*']

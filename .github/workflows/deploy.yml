name: Deploy to AWS Lightsail

run-name: Deploy — ${{ github.event.client_payload.reason || github.event.inputs.reason || 'manual trigger' }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment notes'
        required: false
        default: 'Manual release trigger'
        type: string
  # Sent by the ComputerJy Rebuild Dispatch plugin (inc/computerjy-rebuild-webhook.php)
  # when content the build consumes changes. GitHub only runs repository_dispatch
  # against the default branch, so this always deploys main.
  repository_dispatch:
    types: [wp-content-updated]

# Restrict default GITHUB_TOKEN permissions to least privilege
permissions:
  contents: read

# This is the debounce for publish-triggered deploys, and it lives here rather than
# in the plugin because GitHub already implements exactly the right semantics: at
# most one run per group is pending, and queueing another cancels the previous
# pending one. A bulk edit that fires twenty dispatches therefore produces two
# deploys — the one already running, plus one more that sees the final state.
#
# cancel-in-progress stays false on purpose: an interrupted `rsync --delete` would
# leave the webroot half-written.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Sync to Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # The build fetches all content from the live WordPress API. Cloudflare's bot
      # protection rejects GitHub runner IPs, so this needs the WP_BUILD_TOKEN secret
      # and a matching Cloudflare WAF skip rule. Without them the build fails with a
      # 403 — deliberately, rather than deploying incomplete content.
      - name: Build Astro Static Site
        run: npm run build
        env:
          WP_BUILD_TOKEN: ${{ secrets.WP_BUILD_TOKEN }}

      # Gates the deploy. Content comes from a live WordPress install whose plugins can
      # change the rendered site with no commit here — Jetpack Photon and entity-encoded
      # .rendered fields both did exactly that during the migration, and unit tests,
      # astro check and a green build all passed through them. A failure here means
      # nothing is rsynced, so a regression is never published.
      - name: Verify Build
        run: npm run verify:build
        env:
          WP_BUILD_TOKEN: ${{ secrets.WP_BUILD_TOKEN }}

      - name: Setup SSH Credentials
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Static Files to Lightsail Webroot
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} "sudo mkdir -p /var/www/computerjy_dist && sudo chown -R ${{ secrets.LIGHTSAIL_USER }}:${{ secrets.LIGHTSAIL_USER }} /var/www/computerjy_dist"
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa" dist/ ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/var/www/computerjy_dist/
          ssh -i ~/.ssh/id_rsa ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} "sudo chown -R www-data:www-data /var/www/computerjy_dist && sudo chmod -R 755 /var/www/computerjy_dist"

      - name: Success Notification
        run: echo "🎉 Successfully deployed to https://www.computerjy.com/"

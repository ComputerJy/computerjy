name: Security & Code Quality Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security scan on Mondays at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-security-scan:
    name: PHP & WordPress Theme Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpcs

      - name: Check PHP Syntax (Linting)
        run: |
          find . -maxdepth 3 -name "*.php" -not -path "*/node_modules/*" -not -path "*/dist/*" -not -path "*/.astro/*" -exec php -l {} +

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Global Packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-global-${{ hashFiles('phpcs.xml') }}
          restore-keys: |
            ${{ runner.os }}-composer-global-

      - name: Install WordPress Coding Standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs dealerdirect/phpcodesniffer-composer-installer
          composer global exec -- phpcs -i

      - name: Scan WordPress PHP Code Security
        run: |
          composer global exec -- phpcs --standard=phpcs.xml

  npm-audit-scan:
    name: NPM Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Formatting (Prettier)
        run: npm run format:check

      - name: Run Unit Tests
        run: npm test

      # `astro check` runs the content loaders, so it needs the live WordPress API.
      # Cloudflare Bot Fight Mode used to managed-challenge GitHub runners here
      # (ruleId bot_fight_mode, triggered by the "node" User-Agent from an Azure ASN);
      # it is now disabled. WP_BUILD_TOKEN is sent as X-Build-Auth and is the hook for
      # a WAF skip rule should Super Bot Fight Mode ever be enabled.
      - name: Astro Type & A11y Verification
        run: npx astro check
        env:
          WP_BUILD_TOKEN: ${{ secrets.WP_BUILD_TOKEN }}

      # Catches a *code* regression before merge. The deploy workflow runs the same
      # verification against the build it is about to publish, which is what catches an
      # *upstream* regression that appears with no commit at all.
      - name: Build Astro Static Site
        run: npm run build
        env:
          WP_BUILD_TOKEN: ${{ secrets.WP_BUILD_TOKEN }}

      - name: Verify Build
        run: npm run verify:build
        env:
          WP_BUILD_TOKEN: ${{ secrets.WP_BUILD_TOKEN }}

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high

  workflow-security-scan:
    name: GitHub Actions Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

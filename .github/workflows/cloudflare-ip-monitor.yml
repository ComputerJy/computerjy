name: Cloudflare IP Range Monitor

# Cloudflare's published IP ranges are allow-listed in the origin firewall (ufw).
# If Cloudflare publishes a NEW range that the firewall does not allow, Cloudflare
# loses access to the origin and the site goes down. This job alerts on divergence;
# it never edits the firewall. It also reads the live ufw rules over SSH, because
# deploy/cloudflare-ips.txt is only the record of what the firewall should hold.
#
# GitHub disables `schedule:` triggers in a repository with no commits for 60 days,
# and a monitor that has silently stopped running looks exactly like one reporting
# no problems. Nothing inside the workflow can detect this -- if it is disabled it
# does not run to notice. If this repo goes quiet, check the Actions tab: a disabled
# schedule is shown there with a button to re-enable it.

on:
  schedule:
    # Daily 07:15 UTC. Only notifies on divergence, so daily costs nothing
    # and shrinks the outage-risk detection window from 7 days to 1.
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ranges:
    name: Compare published ranges to firewall allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch Cloudflare published ranges
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 https://www.cloudflare.com/ips-v4 -o /tmp/v4
          curl -fsS --retry 3 --retry-delay 5 https://www.cloudflare.com/ips-v6 -o /tmp/v6
          awk 1 /tmp/v4 /tmp/v6 | tr -d '\r' | sed '/^[[:space:]]*$/d' | sort -u > /tmp/published.txt
          echo "fetched $(wc -l < /tmp/published.txt) ranges"

      - name: Sanity-check the fetch
        # A truncated or error-page response must NOT be reported as "ranges changed".
        run: |
          set -euo pipefail
          V4=$(grep -c '^[0-9]' /tmp/published.txt || true)
          V6=$(grep -c ':'      /tmp/published.txt || true)
          if [ "$V4" -lt 10 ] || [ "$V6" -lt 5 ]; then
            echo "::error::Fetched list looks wrong (v4=$V4 v6=$V6). Treating as a FETCH FAILURE, not a range change."
            exit 1
          fi
          if grep -qvE '^[0-9a-fA-F:.]+/[0-9]{1,3}$' /tmp/published.txt; then
            echo "::error::Fetched list contains non-CIDR lines. Treating as a FETCH FAILURE."
            exit 1
          fi
          echo "sanity OK: $V4 IPv4 + $V6 IPv6"

      - name: Compare against the firewall allowlist
        run: |
          set -euo pipefail
          sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' deploy/cloudflare-ips.txt \
            | tr -d '\r' | sort -u > /tmp/allowlist.txt

          if diff -u /tmp/allowlist.txt /tmp/published.txt > /tmp/diff.txt; then
            echo "No change - firewall allowlist matches Cloudflare's published ranges."
            exit 0
          fi

          {
            echo '### Cloudflare IP ranges changed'
            echo ''
            echo '`+` published by Cloudflare but **NOT allowed through the firewall** - outage risk.'
            echo '`-` allowed through the firewall but no longer published - stale, safe to prune.'
            echo ''
            echo '```diff'
            cat /tmp/diff.txt
            echo '```'
            echo ''
            echo 'Fix: `sudo bash deploy/update-cloudflare-firewall.sh` on the origin, verify,'
            echo 'then update `deploy/cloudflare-ips.txt` and commit.'
          } >> "$GITHUB_STEP_SUMMARY"

          cat /tmp/diff.txt
          echo "::error::Cloudflare ranges diverge from the firewall allowlist - see job summary."
          exit 1

      # Runs even when the comparison above failed, so a range change and a stale
      # Apache config are reported together rather than one masking the other.
      - name: Check the mod_remoteip config matches the allowlist
        if: always()
        run: |
          set -euo pipefail
          if bash deploy/generate-remoteip-conf.sh | diff -u deploy/lightsail-remoteip.conf - > /tmp/conf-diff.txt; then
            echo "mod_remoteip trusted-proxy list matches deploy/cloudflare-ips.txt."
            exit 0
          fi
          {
            echo '### `deploy/lightsail-remoteip.conf` is stale'
            echo ''
            echo 'Apache would stop trusting `CF-Connecting-IP` from any range it is missing, and'
            echo 'those requests would silently go back to logging the Cloudflare edge IP.'
            echo ''
            echo '```diff'
            cat /tmp/conf-diff.txt
            echo '```'
            echo ''
            echo 'Fix: `bash deploy/generate-remoteip-conf.sh > deploy/lightsail-remoteip.conf`, commit,'
            echo 'then re-apply it on the origin.'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/conf-diff.txt
          echo "::error::deploy/lightsail-remoteip.conf does not match deploy/cloudflare-ips.txt."
          exit 1

      # Same pinned-host-key setup as cert-expiry-monitor.yml; see the note there.
      - name: Setup SSH Credentials
        if: always()
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The live firewall can drift from the committed record (a manual ufw edit, or
      # update-cloudflare-firewall.sh run without committing the result), and then the
      # comparison above checks the wrong list.
      - name: Check the live origin firewall matches the allowlist
        if: always()
        env:
          SSH_TARGET: ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' deploy/cloudflare-ips.txt \
            | tr -d '\r' | sort -u > /tmp/allowlist.txt

          if ! ssh -i ~/.ssh/id_rsa -o ConnectTimeout=20 -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$SSH_TARGET" 'sudo ufw status' > /tmp/ufw.txt; then
            echo '### Could not read the origin firewall' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Could not read ufw status from the origin - this check is blind until SSH works."
            exit 1
          fi

          grep '# cloudflare' /tmp/ufw.txt \
            | grep -oE '[0-9a-fA-F:.]+/[0-9]{1,3}' | sort -u > /tmp/live.txt || true

          # An empty result with ufw active is a real (and severe) finding, so it is
          # reported as a diff rather than a read failure.
          if diff -u /tmp/allowlist.txt /tmp/live.txt > /tmp/live-diff.txt; then
            echo "Live ufw rules match deploy/cloudflare-ips.txt ($(wc -l < /tmp/live.txt) ranges)."
            exit 0
          fi
          {
            echo '### Origin firewall drifted from `deploy/cloudflare-ips.txt`'
            echo ''
            echo '`+` allowed on the origin but not recorded. `-` recorded but **not allowed on the origin** - Cloudflare cannot reach it from that range.'
            echo ''
            echo '```diff'
            cat /tmp/live-diff.txt
            echo '```'
            echo ''
            echo 'Fix: `sudo bash deploy/update-cloudflare-firewall.sh` on the origin, then commit the'
            echo 'resulting list to `deploy/cloudflare-ips.txt`.'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/live-diff.txt
          echo "::error::Live ufw rules diverge from deploy/cloudflare-ips.txt - see job summary."
          exit 1

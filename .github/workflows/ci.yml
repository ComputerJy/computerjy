name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose: each step is seconds of work, so separate runners
  # spent more time on checkout than on checks. The job id `ci` is the
  # required status check in the "Protect main" ruleset.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Match the origin's PHP minor so `php -l` and phpcs see what production runs.
      # Bump it when the origin's PHP is upgraded.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      # composer.json pins WPCS.
      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax
        run: npm run lint:php

      - name: phpcs (security, i18n, prefixing)
        run: composer lint

      - name: Prettier
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: actionlint
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          fail_level: error

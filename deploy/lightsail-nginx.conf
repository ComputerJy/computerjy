# ==============================================================================
# AWS Lightsail (Nginx) Configuration for ComputerJy World Headless Astro
# Path: /etc/nginx/sites-available/computerjy.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name computerjy.com www.computerjy.com;
    return 301 https://www.computerjy.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.computerjy.com computerjy.com;

    root /var/www/computerjy/dist;
    index index.html;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/www.computerjy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.computerjy.com/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Astro Immutable Static Assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pass WordPress Admin, API, and Media to PHP-FPM / WordPress backend
    location ~ ^/(wp-admin|wp-login\.php|wp-json|wp-includes|wp-content/uploads) {
        root /var/www/wordpress;
        try_files $uri $uri/ /index.php?$args;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Static Routes & Fallback to 404
    location / {
        try_files $uri $uri/ /404.html =404;
    }

    error_page 404 /404.html;
}

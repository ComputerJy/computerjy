# ==============================================================================
# AWS Lightsail (Ubuntu Apache) configuration for www.computerjy.com
# Target file on server: /etc/apache2/sites-available/computerjy-headless.conf
#
# WordPress renders the site (theme computerjy-2). The Astro build that was the
# DocumentRoot until 2026-09 is retired; see MIGRATION.md. This file is still
# the specification workers/edge-router/src/router.ts was ported from, and
# tests/edge-router.test.ts + tests/apache-vhost.test.ts read it directly.
# ==============================================================================

<VirtualHost *:80>
    ServerName computerjy.com
    ServerAlias www.computerjy.com
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =computerjy.com [OR]
    RewriteCond %{SERVER_NAME} =www.computerjy.com
    RewriteRule ^ https://www.computerjy.com%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.computerjy.com
    ServerAlias computerjy.com
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/wordpress

    # SSL Configuration (Let's Encrypt)
    SSLCertificateFile /etc/letsencrypt/live/computerjy.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/computerjy.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Protocols & Compression
    Protocols h2 http/1.1
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/javascript application/json image/svg+xml application/linkset+json text/markdown application/rss+xml
    </IfModule>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json image/svg+xml application/linkset+json text/markdown application/rss+xml
    </IfModule>

    AddType text/markdown .md

    # --------------------------------------------------------------------------
    # Security & Agent Discovery Headers
    # --------------------------------------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

        # RFC 8288 & RFC 9727 Link Headers for AI Agent & API Discovery
        Header always set Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json;version=3.0", <https://developer.wordpress.org/rest-api/>; rel="service-doc"; type="text/html", </search-index.json>; rel="describedby"; type="application/json", </.well-known/ai-catalog.json>; rel="ai-catalog"; type="application/json"'
        Header always set Vary "Accept, Accept-Encoding"

        # Cloudflare holds anonymous HTML for an hour (the Worker used to do this
        # with the same value); the computerjy-edge-cache plugin purges on publish.
        # Set here rather than in WordPress because W3TC's disk cache serves hits
        # without running PHP. Logged-in, password and commenter cookies bypass it,
        # and WordPress's own no-cache headers for those sessions are left intact.
        # Precondition: W3TC → Browser Cache → HTML & XML must NOT set its own
        # Cache-Control / Expires — per-directory Header directives run after this
        # one and would replace it.
        Header set Cache-Control "public, max-age=0, must-revalidate, s-maxage=3600" "expr=%{CONTENT_TYPE} =~ m#^text/html# && %{REQUEST_METHOD} in {'GET','HEAD'} && %{req:Cookie} !~ /(wordpress_logged_in_|wp-postpass_|comment_author_)/ && %{REQUEST_URI} !~ m#^/(wp-admin|wp-login\.php|wp-json|xmlrpc\.php|wp-cron\.php)# && %{REQUEST_STATUS} == 200"
    </IfModule>

    # Block sensitive hidden files and wp-config (allow .well-known)
    <FilesMatch "^(\.git|\.env|wp-config\.php|readme\.html|license\.txt)">
        Require all denied
    </FilesMatch>

    # RFC 9727 API Catalog Linkset Content-Type
    <Location "/.well-known/api-catalog">
        Header set Content-Type "application/linkset+json; profile=\"https://www.rfc-editor.org/info/rfc9727\""
        Header set Access-Control-Allow-Origin "*"
    </Location>

    # OAuth, ARD, MCP, A2A & Agent Skills Discovery Endpoints Content-Type & CORS
    <LocationMatch "^/\.well-known/(openid-configuration|oauth-authorization-server|oauth-protected-resource|ai-catalog\.json|mcp/server-card\.json|agent-skills/index\.json|agent-card\.json|a2a\.json)">
        Header set Content-Type "application/json"
        Header set Access-Control-Allow-Origin "*"
    </LocationMatch>

    RewriteEngine on

    # --------------------------------------------------------------------------
    # Jetpack server-to-server channel
    # --------------------------------------------------------------------------
    # WordPress.com calls back to the SITE ROOT with `for=jetpack` / `_for=jetpack`.
    # With WordPress as the DocumentRoot this resolves naturally, but the explicit
    # rule stays: the edge Worker mirrors it (router.ts isJetpackCallback) and
    # tests/edge-router.test.ts asserts it is here. Case-sensitive on purpose.
    RewriteCond %{QUERY_STRING} (^|&)_?for=jetpack(&|$)
    RewriteRule ^/?$ /var/www/wordpress/index.php [L,QSA]

    # --------------------------------------------------------------------------
    # Legacy permalinks: /YYYY/MM[/DD]/<slug> -> /posts/<slug>
    # --------------------------------------------------------------------------
    # The site lived at date-based permalinks for a decade; the Worker 301'd
    # them. Same bounded regex as router.ts LEGACY_PERMALINK, so a real post slug
    # that starts with digits cannot be swallowed. WordPress returns 404 for an
    # unknown slug after the redirect, which is the right answer.
    RewriteRule ^/\d{4}/\d{2}(?:/\d{2})?/([^/]+)/?$ /posts/$1 [R=301,L]

    # --------------------------------------------------------------------------
    # Retired Astro endpoints
    # --------------------------------------------------------------------------
    # Feed readers never re-subscribe; /rss.xml must keep working forever.
    RewriteRule ^/rss\.xml$ /feed [R=301,L]
    # Core sitemaps. If an SEO plugin owns sitemaps, change the target to its
    # index (Yoast and Rank Math: /sitemap_index.xml) — robots.txt points at
    # /sitemap.xml precisely so only this line has to change.
    RewriteRule ^/sitemap(-index)?\.xml$ /wp-sitemap.xml [R=301,L]

    # --------------------------------------------------------------------------
    # Markdown Content Negotiation for Agents (Accept: text/markdown)
    # --------------------------------------------------------------------------
    # Real files first (/auth.md, .well-known/*) so they are never shadowed, per
    # .agents/rules/ai-agent-discovery.md. markdown.php reads from WordPress.
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
    RewriteRule ^ - [L]

    RewriteCond %{HTTP:Accept} text/markdown [NC]
    RewriteCond %{REQUEST_URI} !^/(wp-admin|wp-includes|wp-json|wp-content|wp-login\.php|xmlrpc\.php|wp-cron\.php) [NC]
    # END, not L: WordPress's own AllowOverride All lets W3TC's Disk:Enhanced
    # .htaccess rules run after this in per-directory context, matching the
    # original REQUEST_URI and ignoring Accept -- END skips that pass entirely,
    # which is safe because /markdown.php is a real file.
    RewriteRule ^(.*)$ /markdown.php [END,QSA]

    # WP_Site_Health::can_perform_loopback() and W3TC's spawn probe request
    # site_url('wp-cron.php'). Redundant with the DocumentRoot now, kept because
    # the Worker parity test asserts it. Scheduled events are still driven by
    # /etc/cron.d/computerjy-wp-cron.
    Alias /wp-cron.php /var/www/wordpress/wp-cron.php

    <Directory /var/www/wordpress>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Long-lived caching for real static files only. Scoped by filename so
        # generated responses (HTML, /wp-json, /search-index.json, markdown.php)
        # are never touched — WordPress and the header above own those.
        <IfModule mod_expires.c>
            ExpiresActive On
            <FilesMatch "\.(css|js|mjs|woff2)$">
                ExpiresDefault "access plus 1 year"
            </FilesMatch>
            <FilesMatch "\.(svg|webp|avif|png|jpe?g|gif|ico)$">
                ExpiresDefault "access plus 1 month"
            </FilesMatch>
            <FilesMatch "\.(json|webmanifest)$">
                ExpiresDefault "access plus 1 day"
            </FilesMatch>
            <FilesMatch "\.md$">
                ExpiresDefault "access plus 1 hour"
            </FilesMatch>
            <FilesMatch "^(api-catalog|openid-configuration|oauth-authorization-server|oauth-protected-resource)$">
                ExpiresDefault "access plus 1 day"
            </FilesMatch>
        </IfModule>

        <Files "api-catalog">
            ForceType application/linkset+json
        </Files>

        <FilesMatch "^(openid-configuration|oauth-authorization-server|oauth-protected-resource)$">
            ForceType application/json
        </FilesMatch>
    </Directory>

    # Block direct PHP execution inside uploads directory
    <Directory /var/www/wordpress/wp-content/uploads>
        <Files "*.php">
            Require all denied
        </Files>
    </Directory>

    ErrorLog /var/log/apache2/wordpress/error.log
    CustomLog /var/log/apache2/wordpress/access.log combined
</VirtualHost>
</IfModule>

# ==============================================================================
# AWS Lightsail (Ubuntu Apache) Configuration for ComputerJy World Headless Astro
# Target file on server: /etc/apache2/sites-available/computerjy-headless.conf
# ==============================================================================

<VirtualHost *:80>
    ServerName computerjy.com
    ServerAlias www.computerjy.com
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =computerjy.com [OR]
    RewriteCond %{SERVER_NAME} =www.computerjy.com
    RewriteRule ^ https://www.computerjy.com%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.computerjy.com
    ServerAlias computerjy.com
    ServerAdmin webmaster@localhost
    
    # Root directory pointing to Astro static build
    DocumentRoot /var/www/computerjy_dist

    # SSL Configuration (Let's Encrypt)
    SSLCertificateFile /etc/letsencrypt/live/computerjy.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/computerjy.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Protocols & Compression
    Protocols h2 http/1.1
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/javascript application/json image/svg+xml application/linkset+json text/markdown
    </IfModule>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json image/svg+xml application/linkset+json text/markdown
    </IfModule>

    # --------------------------------------------------------------------------
    # Security & Agent Discovery Headers
    # --------------------------------------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

        # RFC 8288 & RFC 9727 Link Headers for AI Agent & API Discovery
        Header always set Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json;version=3.0", <https://developer.wordpress.org/rest-api/>; rel="service-doc"; type="text/html", </search-index.json>; rel="describedby"; type="application/json", </.well-known/ai-catalog.json>; rel="ai-catalog"; type="application/json"'
        Header always set Vary "Accept, Accept-Encoding"
    </IfModule>

    # Block sensitive hidden files and wp-config (allow .well-known)
    <FilesMatch "^(\.git|\.env|wp-config\.php|readme\.html|license\.txt)">
        Require all denied
    </FilesMatch>

    # RFC 9727 API Catalog Linkset Content-Type
    <Location "/.well-known/api-catalog">
        Header set Content-Type "application/linkset+json; profile=\"https://www.rfc-editor.org/info/rfc9727\""
        Header set Access-Control-Allow-Origin "*"
    </Location>

    # OAuth, ARD, MCP, A2A & Agent Skills Discovery Endpoints Content-Type & CORS
    <LocationMatch "^/\.well-known/(openid-configuration|oauth-authorization-server|oauth-protected-resource|ai-catalog\.json|mcp/server-card\.json|agent-skills/index\.json|agent-card\.json|a2a\.json)">
        Header set Content-Type "application/json"
        Header set Access-Control-Allow-Origin "*"
    </LocationMatch>

    RewriteEngine on

    # --------------------------------------------------------------------------
    # Jetpack server-to-server channel (must precede every static rule)
    # --------------------------------------------------------------------------
    # WordPress.com calls back to the SITE ROOT, not to an aliased path:
    #   POST /?for=jetpack&jetpack=comms&token=...&signature=...
    #   GET  /?rest_route=/jetpack/v4/sync/status&_for=jetpack&token=...
    # DocumentRoot is the static Astro build, so without this rule those requests
    # fall through to index.html and WordPress.com receives the homepage instead
    # of a signed response -- which it reports as "site is not connected".
    # The handler is jetpack-connection/src/class-manager.php, which dispatches on
    # $_GET['for'] === 'jetpack' (case-sensitive, hence no [NC] here).
    RewriteCond %{QUERY_STRING} (^|&)_?for=jetpack(&|$)
    RewriteRule ^/?$ /var/www/wordpress/index.php [L,QSA]

    # --------------------------------------------------------------------------
    # Markdown Content Negotiation for Agents (Accept: text/markdown)
    # --------------------------------------------------------------------------
    # Don't rewrite real existing files (e.g. /auth.md, .well-known files)
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
    RewriteRule ^ - [L]

    RewriteCond %{HTTP:Accept} text/markdown [NC]
    RewriteCond %{REQUEST_URI} !^/(wp-admin|wp-includes|wp-json|wp-content) [NC]
    RewriteRule ^(.*)$ /markdown.php [L,QSA]

    # --------------------------------------------------------------------------
    # Serve /path from /path/index.html without a redirect
    # --------------------------------------------------------------------------
    # astro.config.mjs sets trailingSlash: 'never', so every canonical tag and
    # sitemap <loc> advertises /posts/<slug> with no trailing slash -- while mod_dir
    # 301-redirected that exact URL to the slashed form. The URL the site declares
    # canonical was therefore never served with a 200, and every internal link cost
    # a redirect hop. This rewrites internally instead, so the advertised URL is the
    # one that answers, and no published URL changes.
    #
    # DirectorySlash Off does NOT work here: it suppresses the redirect but never
    # performs the DirectoryIndex lookup, so with Options -Indexes the request ends
    # in 403 rather than the page.
    #
    # Anchored to DOCUMENT_ROOT so it can only ever match the Astro build. The
    # WordPress aliases (/wp-admin, /wp-content, ...) resolve outside it and are not
    # directories under it, so they keep mod_dir's default behaviour. It is placed
    # after the markdown rule so Accept: text/markdown still wins for agents.
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}/index.html -f
    RewriteRule ^(.*)$ $1/index.html [L]

    # 1. Route WordPress REST API and Core Endpoints to /var/www/wordpress
    RewriteRule ^/wp-json/(.*)$ /var/www/wordpress/index.php [L,QSA]

    Alias /wp-admin /var/www/wordpress/wp-admin
    Alias /wp-includes /var/www/wordpress/wp-includes
    Alias /wp-content /var/www/wordpress/wp-content
    Alias /wp-login.php /var/www/wordpress/wp-login.php
    Alias /xmlrpc.php /var/www/wordpress/xmlrpc.php
    # WP_Site_Health::can_perform_loopback() and W3TC's spawn probe both request
    # site_url('wp-cron.php'); unaliased it resolves against the static docroot
    # and 404s. Scheduled events are still driven by /etc/cron.d/computerjy-wp-cron.
    Alias /wp-cron.php /var/www/wordpress/wp-cron.php

    <Directory /var/www/wordpress>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct PHP execution inside uploads directory
    <Directory /var/www/wordpress/wp-content/uploads>
        <Files "*.php">
            Require all denied
        </Files>
    </Directory>

    # 2. Astro Static Files Directory
    <Directory /var/www/computerjy_dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted


        # Cache headers for Astro immutable assets
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 month"
            ExpiresByType image/webp "access plus 1 month"
            ExpiresByType application/linkset+json "access plus 1 day"
            ExpiresByType text/markdown "access plus 1 hour"
            ExpiresByType application/json "access plus 1 day"
        </IfModule>

        <Files "api-catalog">
            ForceType application/linkset+json
        </Files>

        <FilesMatch "^(openid-configuration|oauth-authorization-server|oauth-protected-resource)$">
            ForceType application/json
        </FilesMatch>
    </Directory>

    # 3. Feeds and Sitemaps
    Alias /feed /var/www/computerjy_dist/rss.xml
    Alias /sitemap.xml /var/www/computerjy_dist/sitemap-index.xml

    ErrorDocument 404 /404.html
    ErrorLog /var/log/apache2/wordpress/error.log
    CustomLog /var/log/apache2/wordpress/access.log combined
</VirtualHost>
</IfModule>

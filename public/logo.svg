<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- C gradient -->
    <linearGradient id="cGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#3A0CA3" />
    </linearGradient>

    <!-- Play button gradient -->
    <linearGradient id="playGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FA" />
      <stop offset="100%" stop-color="#7209B7" />
    </linearGradient>

    <!-- J gradient -->
    <linearGradient id="jGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF70A6" />
      <stop offset="30%" stop-color="#9B5DE5" />
      <stop offset="60%" stop-color="#F15BB5" />
      <stop offset="85%" stop-color="#F77F00" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>

    <!-- Star / Sparkle gradient -->
    <linearGradient id="starGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FF9F1C" />
      <stop offset="100%" stop-color="#FF4040" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glowFull" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 24px; fill: #0F172A; }
    .brand-accent { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 24px; fill: #0080FF; }
    .brand-tagline { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 9.5px; fill: #64748B; letter-spacing: 0.09em; }

    @media (prefers-color-scheme: dark) {
      .brand-title { fill: #F8FAFC; }
    }
  </style>

  <!-- Left Icon Scaled -->
  <g transform="translate(6, 4) scale(0.48)">
    <!-- Pixel decorative steps on left -->
    <rect x="-6" y="24" width="14" height="14" fill="#00D2FF" rx="2" />
    <rect x="8" y="38" width="12" height="12" fill="#00C0FA" rx="2" />
    <rect x="-6" y="60" width="14" height="16" fill="#0080FF" rx="2" />
    <rect x="-6" y="78" width="14" height="16" fill="#1D4ED8" rx="2" />

    <!-- Main C curve -->
    <path d="M 55 12
             C 82 12, 102 26, 106 44
             L 88 48
             C 84 37, 72 28, 55 28
             C 32 28, 16 46, 16 70
             C 16 94, 32 112, 55 112
             C 72 112, 85 102, 90 90
             L 108 94
             C 102 114, 82 128, 55 128
             C 24 128, 0 102, 0 70
             C 0 38, 24 12, 55 12 Z"
          fill="url(#cGradFull)" />

    <!-- Cute Smiling Face Inside C -->
    <g transform="translate(42, 50)">
      <ellipse cx="6" cy="6" rx="3.5" ry="5.5" fill="#0F172A" />
      <ellipse cx="24" cy="6" rx="3.5" ry="5.5" fill="#0F172A" />
      <path d="M 6 18 Q 15 29, 24 18 Z" fill="#0F172A" />
      <path d="M 9 21 Q 15 27, 21 21 Z" fill="#FF4D6D" />
    </g>

    <!-- Play Button ▶ Inside / Right of C -->
    <path d="M 78 56 L 98 70 L 78 84 Z" fill="url(#playGradFull)" />
    
    <!-- Letter J -->
    <g transform="translate(108, 26)">
      <!-- 4-point Star Sparkle on top of J -->
      <g transform="translate(14, -14)" filter="url(#glowFull)">
        <path d="M 0 -14 Q 0 0, 14 0 Q 0 0, 0 14 Q 0 0, -14 0 Q 0 0, 0 -14 Z" fill="url(#starGradFull)" />
        <circle cx="10" cy="-8" r="2.5" fill="#FFD166" />
      </g>

      <!-- J shape -->
      <path d="M 12 10
               L 26 10
               L 26 70
               C 26 88, 12 98, -8 98
               C -22 98, -32 90, -36 82
               L -24 72
               C -20 78, -14 82, -6 82
               C 6 82, 12 76, 12 64
               Z"
            fill="url(#jGradFull)" />
    </g>
  </g>

  <!-- Typography Next to Logo -->
  <g transform="translate(84, 38)">
    <text x="0" y="0">
      <tspan class="brand-title">Computer</tspan><tspan class="brand-accent">Jy</tspan> <tspan class="brand-title">World</tspan>
    </text>
    <text x="1" y="19" class="brand-tagline">ENTERTAINMENT &amp; TECH</text>
  </g>
</svg>
